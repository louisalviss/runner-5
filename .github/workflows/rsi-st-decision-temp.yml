name: RSI ST Decision Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rsi-st-decision-temp.yml']
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build decision summary
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json,statistics
          from pathlib import Path
          p=Path('evidence/rsi-st-ablation-temp')
          rows=list(csv.DictReader(open(p/'ablation.csv'))); rnd=list(csv.DictReader(open(p/'random.csv')))
          for r in rows:
            for k in ['n','wr','pf','ret','dd','expo','avg']: r[k]=float(r[k])
          for r in rnd:
            for k in ['reps','pf50','pf95','ret50','ret95']: r[k]=float(r[k])
          def region(r): return 'BIST' if r['e'].startswith('BIST') else 'US'
          out={'groups':[],'comparisons':{},'random_gate':[]}
          variants=['E2_ST','E1_ST','ST_ONLY','E2_TIME20','E2_RSI50']
          for it in ['4h','1h']:
            for reg in ['ALL','BIST','US']:
              for v in variants:
                q=[x for x in rows if x['it']==it and x['v']==v and (reg=='ALL' or region(x)==reg)]
                if not q: continue
                out['groups'].append({'it':it,'region':reg,'variant':v,'assets':len(q),'pf_gt1':sum(x['pf']>1 for x in q),'pf_gt1_25':sum(x['pf']>1.25 for x in q),'median_pf':statistics.median(x['pf'] for x in q),'median_ret':statistics.median(x['ret'] for x in q),'median_dd':statistics.median(x['dd'] for x in q),'median_wr':statistics.median(x['wr'] for x in q)})
          keys={(x['s'],x['it']):x for x in rows if x['v']=='E2_ST'}
          for other in ['E1_ST','ST_ONLY','E2_TIME20','E2_RSI50']:
            comps=[]
            for x in rows:
              if x['v']!=other:continue
              a=keys[(x['s'],x['it'])];comps.append({'s':x['s'],'it':x['it'],'region':region(x),'e2_pf':a['pf'],'other_pf':x['pf'],'e2_ret':a['ret'],'other_ret':x['ret']})
            out['comparisons'][other]={}
            for it in ['4h','1h']:
              for reg in ['ALL','BIST','US']:
                q=[z for z in comps if z['it']==it and (reg=='ALL' or z['region']==reg)]
                if q:out['comparisons'][other][f'{it}_{reg}']={'n':len(q),'e2_pf_wins':sum(z['e2_pf']>z['other_pf'] for z in q),'e2_ret_wins':sum(z['e2_ret']>z['other_ret'] for z in q),'median_pf_delta':statistics.median(z['e2_pf']-z['other_pf'] for z in q),'median_ret_delta':statistics.median(z['e2_ret']-z['other_ret'] for z in q)}
          amap={(x['s'],x['it']):x for x in rows if x['v']=='E2_ST'}
          for z in rnd:
            a=amap[(z['s'],z['it'])]
            out['random_gate'].append({'s':z['s'],'it':z['it'],'baseline':z['b'],'actual_pf':a['pf'],'random_pf50':z['pf50'],'random_pf95':z['pf95'],'actual_ret':a['ret'],'random_ret50':z['ret50'],'random_ret95':z['ret95'],'beats_pf95':a['pf']>z['pf95'],'beats_ret95':a['ret']>z['ret95']})
          (p/'decision.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rsi-st-ablation-temp/decision.json
          git commit -m 'Publish RSI ST decision summary [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
