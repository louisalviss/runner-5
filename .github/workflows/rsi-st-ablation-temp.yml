name: RSI ST Ablation Temp
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rsi-st-ablation-temp.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate components across equities
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas numpy websocket-client requests
          git clone -q --depth 1 https://github.com/rongardF/tvDatafeed.git /tmp/tvDatafeed
          OUT='evidence/rsi-st-ablation-temp'; rm -rf "$OUT"; mkdir -p "$OUT"
          set +e
          PYTHONPATH=/tmp/tvDatafeed OUT="$OUT" python3 - <<'PY' > "$OUT/run.log" 2>&1
          import os,json,numpy as np,pandas as pd
          from pathlib import Path
          from tvDatafeed import TvDatafeed,Interval
          O=Path(os.environ['OUT']);tv=TvDatafeed();rng=np.random.default_rng(20260825)
          def rma(s,n):
            a=np.asarray(s,float);y=np.full(len(a),np.nan);v=[];st=None
            for i,x in enumerate(a):
              if np.isfinite(x):v.append(x)
              if len(v)==n:st=i;y[i]=np.mean([a[j] for j in v[-n:]]);break
            if st is None:return pd.Series(y)
            for i in range(st+1,len(a)):y[i]=((n-1)*y[i-1]+a[i])/n if np.isfinite(a[i]) else y[i-1]
            return pd.Series(y)
          def features(d):
            c=d.close;ch=c.diff();up=rma(np.maximum(ch,0),10);dn=rma(np.maximum(-ch,0),10);r=pd.Series(np.where(dn==0,100,np.where(up==0,0,100-100/(1+up/dn))));ma=r.rolling(10,min_periods=10).mean();cross=((r>ma)&(r.shift(1)<=ma.shift(1))).fillna(False).to_numpy(bool);e1=np.zeros(len(d),bool);e2=np.zeros(len(d),bool);cnt=0
            for i in range(len(d)):
              if np.isfinite(r.iloc[i]) and r.iloc[i]>50:cnt=0
              if cross[i] and r.iloc[i]<50:
                cnt+=1
                if cnt==1:e1[i]=1
                if cnt==2:e2[i]=1;cnt=0
            pc=c.shift(1);tr=pd.concat([(d.high-d.low).abs(),(d.high-pc).abs(),(d.low-pc).abs()],axis=1).max(axis=1);atr=rma(tr,10);h=(d.high+d.low)/2;bu=h+2.5*atr;bl=h-2.5*atr;ub=np.full(len(d),np.nan);lb=np.full(len(d),np.nan);st=np.full(len(d),np.nan);di=np.full(len(d),np.nan)
            for i in range(len(d)):
              if not np.isfinite(atr.iloc[i]):continue
              if i==0 or not np.isfinite(ub[i-1]):ub[i]=bu.iloc[i];lb[i]=bl.iloc[i];di[i]=1;st[i]=ub[i];continue
              ub[i]=bu.iloc[i] if bu.iloc[i]<ub[i-1] or c.iloc[i-1]>ub[i-1] else ub[i-1];lb[i]=bl.iloc[i] if bl.iloc[i]>lb[i-1] or c.iloc[i-1]<lb[i-1] else lb[i-1];di[i]=(-1 if c.iloc[i]>ub[i] else 1) if np.isclose(st[i-1],ub[i-1]) else (1 if c.iloc[i]<lb[i] else -1);st[i]=lb[i] if di[i]<0 else ub[i]
            return {'r':r.to_numpy(),'e1':e1,'e2':e2,'bear':np.r_[False,np.diff(di)>0],'bull':np.r_[False,np.diff(di)<0],'r50':(r>50).fillna(False).to_numpy(bool)}
          def bt(d,buy,kind,f,bps=10,hold=20):
            o=d.open.to_numpy(float);cl=d.close.to_numpy(float);cost=bps/1e4;eq=1e4;qty=0.;entry=0.;basis=0.;ei=-1;p=0;pn=[];rt=[];curve=[];expo=0
            for i in range(len(d)):
              if p==-1 and qty>0: px=o[i]*(1-cost);pro=qty*px;pn.append(pro-basis);rt.append(px/entry-1);eq=pro;qty=0.;ei=-1
              elif p==1 and qty==0: px=o[i]*(1+cost);basis=eq;qty=eq/px;entry=px;ei=i
              p=0
              if qty>0:
                ex=f['bear'][i] if kind=='st' else f['r50'][i] if kind=='rsi50' else (i-ei)>=hold
                if ex:p=-1
              elif buy[i]:p=1
              curve.append(eq if qty==0 else qty*cl[i]);expo+=qty>0
            if qty>0:px=cl[-1]*(1-cost);pro=qty*px;pn.append(pro-basis);rt.append(px/entry-1);eq=pro;curve[-1]=eq
            win=[x for x in pn if x>0];los=[x for x in pn if x<0];gp=sum(win);gl=-sum(los);arr=np.asarray(curve);pk=np.maximum.accumulate(arr);dd=arr/pk-1
            return {'n':len(pn),'wr':100*len(win)/len(pn) if pn else 0,'pf':gp/gl if gl else (999 if gp else 0),'ret':100*(eq/1e4-1),'dd':100*dd.min(),'expo':100*expo/len(d),'avg':100*np.mean(rt) if rt else 0}
          def rand(d,f,n,elig,reps=40):
            ids=np.flatnonzero(elig & np.isfinite(f['r']));n=min(n,len(ids));v=[]
            if n<5:return None
            for _ in range(reps):
              b=np.zeros(len(d),bool);b[rng.choice(ids,n,False)]=1;v.append(bt(d,b,'st',f))
            return {'reps':reps,'pf50':float(np.median([x['pf'] for x in v])),'pf95':float(np.percentile([x['pf'] for x in v],95)),'ret50':float(np.median([x['ret'] for x in v])),'ret95':float(np.percentile([x['ret'] for x in v],95))}
          specs=[('XU100','BIST_DLY'),('THYAO','BIST'),('GARAN','BIST'),('ASELS','BIST'),('BIMAS','BIST'),('TUPRS','BIST'),('SPY','AMEX'),('QQQ','NASDAQ'),('AAPL','NASDAQ'),('MSFT','NASDAQ'),('NVDA','NASDAQ'),('AMZN','NASDAQ'),('TSLA','NASDAQ')];ints=[('4h',Interval.in_4_hour),('1h',Interval.in_1_hour)];rows=[];rnd=[];meta=[];rep={'XU100','THYAO','SPY','AAPL'}
          for s,e in specs:
            for it,iv in ints:
              try:d=tv.get_hist(s,e,iv,n_bars=5000,extended_session=False)
              except Exception as x:meta.append({'s':s,'e':e,'it':it,'err':repr(x)});continue
              if d is None or len(d)<500:meta.append({'s':s,'e':e,'it':it,'rows':0 if d is None else len(d)});continue
              d=d.reset_index();f=features(d);meta.append({'s':s,'e':e,'it':it,'rows':len(d),'start':str(d.datetime.iloc[0]),'end':str(d.datetime.iloc[-1]),'e2signals':int(f['e2'].sum())})
              for nm,b,k,h in [('E2_ST',f['e2'],'st',20),('E1_ST',f['e1'],'st',20),('ST_ONLY',f['bull'],'st',20),('E2_TIME20',f['e2'],'time',20),('E2_RSI50',f['e2'],'rsi50',20)]:rows.append({'s':s,'e':e,'it':it,'v':nm,**bt(d,b,k,f,10,h)})
              if s in rep:
                for bn,el in [('RAND_ALL',np.ones(len(d),bool)),('RAND_LT50',np.isfinite(f['r'])&(f['r']<50))]:
                  z=rand(d,f,int(f['e2'].sum()),el)
                  if z:rnd.append({'s':s,'e':e,'it':it,'b':bn,**z})
          R=pd.DataFrame(rows);Z=pd.DataFrame(rnd);summary=[]
          for it in ['4h','1h']:
            q=R[(R.it==it)&(R.v=='E2_ST')];summary.append({'it':it,'assets':len(q),'pf_gt1':int((q.pf>1).sum()),'pf_gt1_25':int((q.pf>1.25).sum()),'median_pf':float(q.pf.median()),'median_ret':float(q.ret.median())})
          R.to_csv(O/'ablation.csv',index=False);Z.to_csv(O/'random.csv',index=False);(O/'results.json').write_text(json.dumps({'meta':meta,'rows':rows,'random':rnd,'summary':summary},indent=2));print(pd.DataFrame(summary).to_string(index=False));print(R[R.v.isin(['E2_ST','E1_ST','ST_ONLY'])].round(2).to_string(index=False));print(Z.round(2).to_string(index=False))
          PY
          RC=$?
          set -e
          echo "rc=$RC" > "$OUT/status.txt"
          cat "$OUT/run.log" || true
          exit "$RC"
      - name: Persist
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/rsi-st-ablation-temp || true
          git commit -m 'Publish RSI ST ablation temp [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main || true
