name: Agent Reach Benchmark

on:
  push:
    branches:
      - test/agent-reach-benchmark-20260821
    paths:
      - '.github/workflows/agent-reach-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-reach-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fast dependencies
        run: python -m pip install -q 'yt-dlp[default]'

      - name: Install Agent Reach and channels
        shell: bash
        run: |
          set -u
          python -m pip install --upgrade -q pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          pipx install https://github.com/Panniantong/agent-reach/archive/main.zip
          agent-reach install --env=auto --system --channels=twitter,reddit,bilibili || true

      - name: Doctor
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/agent-reach-bench
          agent-reach doctor --json > /tmp/agent-reach-bench/doctor.json 2>&1
          exit 0

      - name: Hybrid benchmark
        shell: bash
        run: |
          set +e
          python social_reach.py jobs/social-reach/2026-08-21-hybrid-benchmark-v3.json --output /tmp/social-reach-v3
          echo "$?" > /tmp/agent-reach-bench/hybrid-exit.txt
          exit 0

      - name: Raw backend benchmark
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          OUT=/tmp/agent-reach-bench
          : > "$OUT/raw.tsv"
          bench() {
            name="$1"; shift
            start=$(date +%s%3N)
            timeout 60s "$@" > "$OUT/${name}.out" 2> "$OUT/${name}.err"
            code=$?
            end=$(date +%s%3N)
            bytes=$(wc -c < "$OUT/${name}.out" | tr -d ' ')
            printf '%s\t%s\t%s\t%s\n' "$name" "$code" "$((end-start))" "$bytes" >> "$OUT/raw.tsv"
          }
          bench x_jina curl -LfsS 'https://r.jina.ai/https://x.com/kun66666677/status/2090329858920657060'
          if command -v twitter >/dev/null 2>&1; then
            bench x_twitter_cli twitter tweet 'https://x.com/kun66666677/status/2090329858920657060'
          else
            printf 'x_twitter_cli\t127\t0\t0\n' >> "$OUT/raw.tsv"
          fi
          if command -v rdt >/dev/null 2>&1; then
            bench reddit_rdt rdt popular --limit 5
          else
            printf 'reddit_rdt\t127\t0\t0\n' >> "$OUT/raw.tsv"
          fi
          bench youtube_ytdlp yt-dlp --dump-json --skip-download 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
          cat "$OUT/raw.tsv"
          exit 0

      - name: Build benchmark result
        shell: bash
        run: |
          mkdir -p results/agent-reach-benchmark
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('/tmp/agent-reach-bench')
          try:
              doctor=json.loads((root/'doctor.json').read_text())
          except Exception:
              doctor={'raw':(root/'doctor.json').read_text(errors='replace') if (root/'doctor.json').exists() else ''}
          hybrid=json.loads(pathlib.Path('/tmp/social-reach-v3/result.json').read_text())
          raw=[]
          for line in (root/'raw.tsv').read_text().splitlines():
              p=line.split('\t')
              if len(p)==4:
                  raw.append({'test':p[0],'exit':int(p[1]),'ms':int(p[2]),'stdout_bytes':int(p[3])})
          out={
              'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'hybrid':hybrid,
              'agent_reach_doctor':doctor,
              'raw_backend_benchmark':raw,
          }
          pathlib.Path('results/agent-reach-benchmark/latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Persist benchmark result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'runner-5-benchmark'
          git config user.email 'runner-5-benchmark@users.noreply.github.com'
          git add -- results/agent-reach-benchmark/latest.json
          git commit -m 'Store Agent Reach hybrid benchmark [skip ci]' || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 2
          done
          exit 1
